<!DOCTYPE html>
<!--
SETUP (Firebase)

=== 1) Authentication ===
Firebase console > Build > Authentication > Sign-in method > enable "Anonymous".

=== 2) Realtime Database rules (Build > Realtime Database > Rules) ===
{
  "rules": {
    "media": {
      ".read": "auth != null",
      "$id": {
        ".write": "auth != null && (!data.exists() || data.child('uploaderId').val() === auth.uid)",
        ".validate": "newData.hasChildren(['url','kind','createdAt']) || !newData.exists()"
      }
    },
    "votes": {
      ".read": "auth != null",
      "$uid": { ".write": "auth != null && auth.uid === $uid" }
    },
    "settings": {
      ".read": "auth != null",
      ".write": "auth != null"
    }
  }
}

=== 3) Storage rules (Build > Storage > Rules) ===
rules_version = '2';
service firebase.storage {
  match /b/{bucket}/o {
    match /media/{uid}/{file} {
      allow read: if request.auth != null;
      allow write: if request.auth != null && request.auth.uid == uid
                   && request.resource.size < 20 * 1024 * 1024
                   && (request.resource.contentType.matches('image/.*') || request.resource.contentType.matches('video/.*'));
      allow delete: if request.auth != null && request.auth.uid == uid;
    }
  }
}

=== 4) Hosting ===
Authentication > Settings > Authorized domains: add the domain where you host voter-portfolio-firebase.html
(Firebase Hosting, Netlify, GitHub Pages, etc.). Change ADMIN_PIN near the top of the file's script.

-->

  size(); addEventListener("resize", size);
  setInterval(function () {
    x.fillStyle = "rgba(2,6,2,.12)"; x.fillRect(0, 0, c.width, c.height);
    x.fillStyle = "#00ff41"; x.font = fs + "px monospace";

      x.fillText(chars.charAt(Math.floor(Math.random() * chars.length)), i * fs, drops[i] * fs);

})();

<script>
(function () {
  var ACCEPT = ["image/jpeg","image/png","image/webp","image/gif","video/mp4","video/webm"];
  var MAX = 20 * 1024 * 1024;
  var S = { items: [], votes: [], phase: "upload", filter: "all", sort: "new", connected: false, me: null, canUpload: false, isAdmin: false, adminLogin: false, queue: [], busy: false, lbId: null };
  var $ = function (id) { return document.getElementById(id); };
  var el = function (tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

  function setMsg(t, err) { var m = $("msg"); m.textContent = t || ""; m.className = "msg" + (err ? " err" : ""); }
  function setVMsg(t) { $("vmsg").textContent = t || ""; }
  function ago(ts) {
    var s = Math.max(1, Math.floor((Date.now() - ts) / 1000));
    if (s < 60) return "just now";
    var m = Math.floor(s / 60); if (m < 60) return m + " min ago";
    var h = Math.floor(m / 60); if (h < 24) return h + " h ago";
    var d = Math.floor(h / 24); if (d < 30) return d + " d ago";
    return new Date(ts).toLocaleDateString();
  }

  /* ---------- derived data ---------- */
  function tally() {
    var ids = {}; S.items.forEach(function (i) { ids[i.id] = 1; });
    var counts = {}, mine = null, total = 0;
    S.votes.forEach(function (v) {
      if (!ids[v.mediaId]) return;
      counts[v.mediaId] = (counts[v.mediaId] || 0) + 1; total++;
      if (S.me && v.voter === S.me) mine = v.mediaId;
    });
    return { counts: counts, mine: mine, total: total };
  }
  function mediaNode(it, thumb) {
    var node;
    if (it.kind === "video") { node = document.createElement("video"); node.preload = "metadata"; node.muted = true; node.playsInline = true; node.src = it.url + "#t=0.1"; }
    else { node = document.createElement("img"); node.loading = "lazy"; node.alt = it.caption || "Voter photo"; node.src = it.url; }
    return node;
  }

  /* ---------- render ---------- */
  var T = { counts: {}, mine: null, total: 0 };
  function render() {
    T = tally();
    var imgs = S.items.filter(function (i) { return i.kind === "image"; }).length;
    $("sAll").textContent = S.items.length; $("sImg").textContent = imgs; $("sVid").textContent = S.items.length - imgs; $("sVotes").textContent = T.total;
    renderPhase(); renderLeaders(); renderGallery(); renderQueue(); updateLbActs();
    $("uploadCard").hidden = S.phase !== "upload";
  }

  function renderPhase() {
    var p = $("phase"); p.textContent = "";
    p.className = "phase " + S.phase;
    var t = el("div", "t");
    if (S.phase === "upload") { t.textContent = "📥 Upload phase"; t.appendChild(el("small", "", "Add your photos and videos. Voting opens when the organiser starts it.")); }
    else if (S.phase === "voting") { var sp = el("span", "live"); t.appendChild(sp); t.appendChild(document.createTextNode("Voting is LIVE")); t.appendChild(el("small", "", "One vote per person. Tap a vote again to remove it, or vote for another to switch.")); }
    else { t.textContent = "🏆 Voting closed"; t.appendChild(el("small", "", "Final results are below.")); }
    p.appendChild(t);
    var a = el("div", "admin");
    function btn(label, next, msg) { var b = el("button", "sm" + (next === "voting" ? " primary" : ""), label); b.onclick = function () { if (confirm(msg)) B.setPhase(next).catch(function (e) { alert("Could not change phase: " + ((e && e.message) || "error")); }); }; a.appendChild(b); }
    if (S.isAdmin) {
      if (S.phase === "upload") btn("Start voting", "voting", "Start live voting? Uploads will pause.");
      if (S.phase === "voting") { btn("Close voting", "closed", "Close voting and show final results?"); btn("Back to uploads", "upload", "Return to the upload phase? Votes are kept."); }
      if (S.phase === "closed") { btn("Reopen voting", "voting", "Reopen voting?"); }
    } else if (S.adminLogin) {
      var l = el("button", "sm", "Organiser login"); l.onclick = function () { B.loginAdmin().then(function (ok) { if (ok) { S.isAdmin = true; render(); } else alert("Wrong PIN"); }); }; a.appendChild(l);
    }
    p.appendChild(a);
  }

  function renderLeaders() {
    var wrap = $("leadersWrap"), box = $("leaders"); box.textContent = "";
    var ranked = S.items.filter(function (i) { return (T.counts[i.id] || 0) > 0; })
      .sort(function (a, b) { return (T.counts[b.id] - T.counts[a.id]) || (a.createdAt - b.createdAt); }).slice(0, 3);
    wrap.hidden = S.phase === "upload" || !ranked.length;
    $("leadersTitle").textContent = S.phase === "closed" ? "🏆 Final results" : "Live leaderboard";
    var medals = ["🥇", "🥈", "🥉"];
    ranked.forEach(function (it, i) {
      var c = el("div", "leader" + (S.phase === "closed" && i === 0 ? " win" : ""));
      c.appendChild(el("div", "rk", medals[i]));
      var th = el("div", "th"); th.appendChild(mediaNode(it, true)); c.appendChild(th);
      var d = el("div"); d.appendChild(el("div", "nm", it.caption || (it.kind === "video" ? "Video" : "Photo")));
      d.appendChild(el("div", "ct", T.counts[it.id] + (T.counts[it.id] === 1 ? " vote" : " votes") + " · " + (it.name || "A voter")));
      c.appendChild(d); box.appendChild(c);
    });
  }

  function voteButton(it, cls) {
    var mine = T.mine === it.id;
    var b = el("button", (cls || "") + " vote" + (mine ? " on" : ""), mine ? "✓ Your vote" : "👍 Vote");
    b.type = "button";
    b.onclick = function (e) { e.stopPropagation(); castVote(it); };
    return b;
  }

  function renderGallery() {
    var g = $("gallery"); g.textContent = "";
    var list = S.items.filter(function (i) { return S.filter === "all" || i.kind === S.filter; });
    list.sort(function (a, b) {
      if (S.sort === "top") return ((T.counts[b.id] || 0) - (T.counts[a.id] || 0)) || (b.createdAt - a.createdAt);
      return b.createdAt - a.createdAt;
    });
    $("empty").hidden = list.length > 0;
    list.forEach(function (it) {
      var t = el("div", "tile" + (T.mine === it.id ? " mine" : ""));
      var m = el("div", "media"); m.tabIndex = 0; m.setAttribute("role", "button");
      m.setAttribute("aria-label", "Open " + (it.kind === "video" ? "video" : "photo") + (it.caption ? ": " + it.caption : ""));
      var node = mediaNode(it);
      node.onerror = function () { m.textContent = "Media unavailable"; m.style.padding = "28px 12px"; m.style.textAlign = "center"; };
      m.appendChild(node);
      m.appendChild(el("span", "badge", it.kind === "video" ? "▶ Video" : "Photo"));
      m.addEventListener("click", function () { openLb(it); });
      m.addEventListener("keydown", function (e) { if (e.key === "Enter") openLb(it); });
      t.appendChild(m);
      var c = el("div", "cap");
      if (it.caption) c.appendChild(el("p", "", it.caption));
      c.appendChild(el("small", "", (it.name || "A voter") + " · " + ago(it.createdAt)));
      t.appendChild(c);
      if (S.phase !== "upload") {
        var r = el("div", "vrow"), n = T.counts[it.id] || 0;
        var vc = el("div", "vcount", String(n)); vc.appendChild(el("small", "", n === 1 ? " vote" : " votes")); r.appendChild(vc);
        if (S.phase === "voting") r.appendChild(voteButton(it, "sm"));
        t.appendChild(r);
      } else { t.appendChild(el("div", "vrow")); t.lastChild.style.padding = "0 0 6px"; }
      g.appendChild(t);
    });
  }

  /* ---------- lightbox ---------- */
  function openLb(it) {
    var b = $("lbBody"); b.textContent = ""; S.lbId = it.id;
    var node;
    if (it.kind === "video") { node = document.createElement("video"); node.controls = true; node.autoplay = true; node.playsInline = true; }
    else { node = document.createElement("img"); node.alt = it.caption || "Voter photo"; }
    node.src = it.url; b.appendChild(node);
    var meta = el("div", "meta");
    if (it.caption) meta.appendChild(el("div", "", it.caption));
    meta.appendChild(el("small", "", (it.name || "A voter") + " · " + ago(it.createdAt)));
    b.appendChild(meta);
    var acts = el("div", "acts"); acts.id = "lbActs"; b.appendChild(acts);
    updateLbActs();
    $("lb").showModal();
  }
  function updateLbActs() {
    var acts = $("lbActs"); if (!acts || !$("lb").open) return;
    var it = S.items.filter(function (i) { return i.id === S.lbId; })[0];
    acts.textContent = "";
    if (!it) { $("lb").close(); return; }
    if (S.phase === "voting") acts.appendChild(voteButton(it));
    if (S.phase !== "upload") acts.appendChild(el("span", "", (T.counts[it.id] || 0) + " votes"));
    if (S.isAdmin || (S.me && it.uploaderId === S.me)) {
      var del = el("button", "del", "Delete"); del.onclick = function () { removeItem(it); }; acts.appendChild(del);
    }
    var close = el("button", "", "Close"); close.onclick = function () { $("lb").close(); }; acts.appendChild(close);
  }
  $("lb").addEventListener("click", function (e) { if (e.target === $("lb")) $("lb").close(); });
  $("lb").addEventListener("close", function () { $("lbBody").textContent = ""; S.lbId = null; });

  async function removeItem(it) {
    if (!confirm("Delete this post for everyone? This cannot be undone.")) return;
    try { await B.removeMedia(it); $("lb").close(); }
    catch (e) { alert("Could not delete: " + ((e && e.message) || "unknown error")); }
  }

  /* ---------- voting ---------- */
  async function castVote(it) {
    if (S.phase !== "voting") return;
    if (!S.me) { setVMsg("Sign in to vote."); return; }
    setVMsg("");
    try { if (T.mine === it.id) await B.unvote(); else await B.vote(it.id); }
    catch (e) { setVMsg("Your vote could not be saved" + (e && e.message ? ": " + e.message : ".")); }
  }

  /* ---------- controls ---------- */
  document.querySelectorAll(".tabs [data-f]").forEach(function (b) {
    b.addEventListener("click", function () {
      S.filter = b.dataset.f;
      document.querySelectorAll(".tabs [data-f]").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
      renderGallery();
    });
  });
  document.querySelectorAll(".tabs [data-s]").forEach(function (b) {
    b.addEventListener("click", function () {
      S.sort = b.dataset.s;
      document.querySelectorAll(".tabs [data-s]").forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
      renderGallery();
    });
  });

  /* ---------- queue / upload ---------- */
  function addFiles(files) {
    var problems = [];
    Array.prototype.forEach.call(files, function (f) {
      if (ACCEPT.indexOf(f.type) < 0) { problems.push(f.name + ": unsupported type (use JPG, PNG, WebP, GIF, MP4 or WebM)"); return; }
      if (f.size > MAX) { problems.push(f.name + ": larger than 20 MB"); return; }
      S.queue.push({ file: f, url: URL.createObjectURL(f), status: "", err: false });
    });
    setMsg(problems.join(" · "), problems.length > 0);
    renderQueue();
  }
  function renderQueue() {
    var q = $("queue"); q.textContent = "";
    S.queue.forEach(function (x, i) {
      var d = el("div", "q"), n;
      if (x.file.type.indexOf("video") === 0) { n = document.createElement("video"); n.muted = true; n.src = x.url + "#t=0.1"; n.preload = "metadata"; }
      else { n = document.createElement("img"); n.src = x.url; n.alt = ""; }
      d.appendChild(n);
      if (x.status) d.appendChild(el("div", "st" + (x.err ? " err" : ""), x.status));
      if (!S.busy) { var r = el("button", "rm", "×"); r.type = "button"; r.setAttribute("aria-label", "Remove"); r.onclick = function () { URL.revokeObjectURL(x.url); S.queue.splice(i, 1); renderQueue(); }; d.appendChild(r); }
      q.appendChild(d);
    });
    $("go").disabled = S.busy || !S.queue.length || !S.canUpload;
  }

  async function upload() {
    if (S.busy || !S.canUpload) return;
    S.busy = true; setMsg(""); renderQueue();
    var name = $("name").value.trim(), caption = $("caption").value.trim();
    try { localStorage.setItem("vp_name", name); } catch (e) {}
    var ok = 0, fail = 0, remaining = [];
    for (var i = 0; i < S.queue.length; i++) {
      var x = S.queue[i]; x.status = "Uploading…"; x.err = false; renderQueue();
      try {
        var r = await B.upload(x.file);
        var rec = { kind: x.file.type.indexOf("video") === 0 ? "video" : "image", caption: caption, name: name, uploaderId: S.me || "", createdAt: Date.now() };
        Object.keys(r).forEach(function (k) { rec[k] = r[k]; });
        await B.addMedia(rec);
        URL.revokeObjectURL(x.url); ok++;
      } catch (e) {
        fail++; x.err = true;
        var code = e && e.code;
        x.status = code === "too_large" ? "Too large" : code === "quota_or_state" ? "Storage full" : code === "unsupported_type" ? "Unsupported" : code === "rate_limited" ? "Slow down" : "Failed";
        remaining.push(x);
      }
    }
    S.queue = remaining; S.busy = false; renderQueue();
    if (ok) $("caption").value = "";
    setMsg((ok ? ok + " uploaded. " : "") + (fail ? fail + " failed, check the marked files and try again." : ""), fail > 0);
  }
  $("go").addEventListener("click", upload);

  var drop = $("drop");
  drop.addEventListener("click", function () { $("file").click(); });
  drop.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("file").click(); } });
  $("file").addEventListener("change", function (e) { addFiles(e.target.files); e.target.value = ""; });
  ["dragenter", "dragover"].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add("over"); }); });
  ["dragleave", "drop"].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove("over"); }); });
  drop.addEventListener("drop", function (e) { if (e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files); });
  try { var saved = localStorage.getItem("vp_name"); if (saved) $("name").value = saved; } catch (e) {}

  /* ---------- start ---------- */
  setMsg("Connecting…");
  render();
  B.init().then(function (info) {
    S.connected = info.connected; S.me = info.me; S.canUpload = info.canUpload; S.isAdmin = info.isAdmin; S.adminLogin = !!info.adminLogin;
    if (!info.connected) { setMsg("Sign in to view and take part.", true); render(); return; }
    setMsg(S.canUpload ? "" : "You can browse and vote, but your account can't upload here.", !S.canUpload);
    B.onMedia(function (items) { S.items = items; render(); }, function () { setMsg("Could not load the gallery.", true); });
    B.onVotes(function (v) { S.votes = v; render(); });
    B.onPhase(function (p) { S.phase = p; render(); });
    render();
  }).catch(function () { setMsg("Could not connect.", true); });
})();
</script>
</body>
</html>
